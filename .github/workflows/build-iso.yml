name: Build x86-64 ISO Installer (OpenWrt 25.12.x)

# 两阶段：Job1 构建固件 → Job2 用 img-installer 封装为 ISO 安装器
# ISO 引导一个 Debian live 系统，跑码结束后命令行输入 ddd 即可选择目标硬盘写入
# 适用：虚拟机（PVE/ESXi 等）与物理机（Ventoy / balenaEtcher 写 U 盘）
on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "选择 OpenWrt 固件版本"
        required: false
        default: "25.12.6"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
          - 25.12.2
          - 25.12.3
          - 25.12.4
          - 25.12.5
          - 25.12.6
      profile:
        description: "根文件系统大小（固件空间）"
        required: true
        type: choice
        default: "1G"
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"
      custom_router_ip:
        description: "管理后台 IP（仅多网口生效）；单网口/旁路由请勿修改"
        required: true
        default: "192.168.100.1"
      include_docker:
        description: "是否集成 Docker"
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      enable_pppoe:
        description: "是否配置 PPPoE 拨号"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"
      pppoe_account:
        description: "宽带账号（启用 PPPoE 时必填）"
        required: false
      pppoe_password:
        description: "宽带密码（启用 PPPoE 时必填）"
        required: false

permissions:
  contents: write

jobs:
  build_firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 保存自定义管理 IP
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ github.event.inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"

      - name: 校验 PPPoE 输入
        run: |
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "::error::启用 PPPoE 时宽带账号/密码不能为空！"
              exit 1
            fi
          fi

      - name: 云端 ImageBuilder 构建固件
        run: |
          profile="${{ github.event.inputs.profile }}"
          case "$profile" in
            1G) ROOTFS_SIZE=1024 ;;
            2G) ROOTFS_SIZE=2048 ;;
            3G) ROOTFS_SIZE=3072 ;;
            4G) ROOTFS_SIZE=4096 ;;
          esac
          mkdir -p "${{ github.workspace }}/bin" "${{ github.workspace }}/dl"
          chmod +x "${{ github.workspace }}/x86-64/build.sh"
          docker run --rm -i --user root \
            -v "${{ github.workspace }}/bin:/builder/bin" \
            -v "${{ github.workspace }}/dl:/builder/dl" \
            -v "${{ github.workspace }}/files:/builder/files" \
            -v "${{ github.workspace }}/custom:/builder/files/etc/config" \
            -v "${{ github.workspace }}/x86-64/build.sh:/builder/build.sh" \
            -e PROFILE="$ROOTFS_SIZE" -e INCLUDE_DOCKER="${{ inputs.include_docker }}" \
            -e ENABLE_PPPOE="${{ inputs.enable_pppoe }}" \
            -e PPPOE_ACCOUNT="${{ inputs.pppoe_account }}" -e PPPOE_PASSWORD="${{ inputs.pppoe_password }}" \
            openwrt/imagebuilder:x86-64-${{ github.event.inputs.openwrt_version }} \
            /bin/bash /builder/build.sh

      - name: 复制固件到根目录
        run: |
          cp "${{ github.workspace }}"/bin/targets/x86/64/*squashfs-combined-efi.img.gz "${{ github.workspace }}"/

      - name: 上传固件 artifact（供 ISO 封装）
        uses: actions/upload-artifact@v6
        with:
          name: firmware-img
          path: |
            *.img.gz

  build_installer_iso:
    runs-on: ubuntu-22.04
    needs: build_firmware
    steps:
      - name: 下载固件 artifact
        uses: actions/download-artifact@v7
        with:
          name: firmware-img

      - name: 同步 img-installer 项目（制作 ISO 安装器）
        run: |
          git clone https://github.com/wukongdaily/img-installer.git
          cd img-installer
          chmod +x custom.sh
          chmod +x supportFiles/custom/build.sh

      - name: 制作 ISO
        run: |
          firmware_file=$(ls *squashfs-combined-efi.img.gz)
          cd img-installer
          bash autobuild/autobuild.sh "../$firmware_file"

      - name: 发布 ISO 到 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Custom-Installer-x86_64-ISO
          body: "自定义 OpenWrt x86-64 ISO 安装器：虚拟机/物理机引导后输入 ddd 即可安装到目标硬盘。"
          files: |
            img-installer/output/custom-installer-x86_64.iso
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
