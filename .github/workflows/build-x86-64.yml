name: Build x86-64 OpenWrt (25.12.x)

# 云端 ImageBuilder 打包（非源码编译）
# 用法：Fork/推送本仓库到 GitHub → Actions → Run workflow → 填参数 → 构建并发布到 Release
on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "选择 OpenWrt 固件版本"
        required: false
        default: "25.12.6"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
          - 25.12.2
          - 25.12.3
          - 25.12.4
          - 25.12.5
          - 25.12.6
      profile:
        description: "根文件系统大小（固件空间）"
        required: true
        type: choice
        default: "1G"
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"
      custom_router_ip:
        description: "管理后台 IP（仅多网口生效，格式 192.168.x.1 / 10.x.x.1）；单网口/旁路由请勿修改"
        required: true
        default: "192.168.100.1"
      include_docker:
        description: "是否集成 Docker（dockerd + luci-app-dockerman）"
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      enable_pppoe:
        description: "是否配置 PPPoE 拨号（启用则必须填写账号密码）"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"
      pppoe_account:
        description: "宽带账号（启用 PPPoE 时必填）"
        required: false
      pppoe_password:
        description: "宽带密码（启用 PPPoE 时必填）"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 保存自定义管理 IP（供首次启动脚本读取）
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ github.event.inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "管理地址: ${{ github.event.inputs.custom_router_ip }}"

      - name: 校验 PPPoE 输入
        run: |
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "::error::启用 PPPoE 时宽带账号/密码不能为空！"
              exit 1
            fi
          fi

      - name: 云端 ImageBuilder 构建
        run: |
          profile="${{ github.event.inputs.profile }}"
          case "$profile" in
            1G) ROOTFS_SIZE=1024 ;;
            2G) ROOTFS_SIZE=2048 ;;
            3G) ROOTFS_SIZE=3072 ;;
            4G) ROOTFS_SIZE=4096 ;;
          esac
          echo "ROOTFS_SIZE=$ROOTFS_SIZE" >> "$GITHUB_ENV"
          mkdir -p "${{ github.workspace }}/bin" "${{ github.workspace }}/dl"
          chmod +x "${{ github.workspace }}/x86-64/build.sh"
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/builder/bin" \
            -v "${{ github.workspace }}/dl:/builder/dl" \
            -v "${{ github.workspace }}/files:/builder/files" \
            -v "${{ github.workspace }}/custom:/builder/files/etc/config" \
            -v "${{ github.workspace }}/x86-64/build.sh:/builder/build.sh" \
            -e PROFILE="$ROOTFS_SIZE" \
            -e INCLUDE_DOCKER="${{ inputs.include_docker }}" \
            -e ENABLE_PPPOE="${{ inputs.enable_pppoe }}" \
            -e PPPOE_ACCOUNT="${{ inputs.pppoe_account }}" \
            -e PPPOE_PASSWORD="${{ inputs.pppoe_password }}" \
            -e OPENWRT_VERSION="${{ inputs.openwrt_version }}" \
            openwrt/imagebuilder:x86-64-${{ github.event.inputs.openwrt_version }} \
            /bin/bash /builder/build.sh

      - name: 生成发布信息
        run: |
          cat > "${{ github.workspace }}/router-info.md" <<EOF
          ## 路由器后台信息
          - 后台地址: ${{ github.event.inputs.custom_router_ip }}
          - 用户名: root
          - 密码: 无
          - OpenWrt 版本: ${{ github.event.inputs.openwrt_version }}
          - 集成 Docker: ${{ github.event.inputs.include_docker }}
          - PPPoE: ${{ github.event.inputs.enable_pppoe }}
          EOF

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Autobuild-x86-64
          body_path: "${{ github.workspace }}/router-info.md"
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/*ext4-combined-efi.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
